<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>20/10 — Particle Love</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030106}
body{font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh}
.hint{position:fixed;left:0;right:0;bottom:12px;text-align:center;color:#ffc4d0;font-size:12px;opacity:.6;pointer-events:none;letter-spacing:1px}
#error{display:none;position:fixed;inset:0;place-items:center;text-align:center;padding:28px;color:#fff;background:#10040b;line-height:1.7}
#error code{color:#ff8aa5}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hint">20/10 · MADE WITH LOVE</div>
<div id="error">Không tìm thấy ảnh <code>poster.png</code>.<br>Hãy để file <code>poster.png</code> cùng thư mục với file HTML.</div>
<script>
const canvas=document.querySelector('#scene');
const ctx=canvas.getContext('2d',{alpha:false});
const img=new Image(); img.src='poster.png';
let W=0,H=0,D=1,points=[],ambient=[],start=0,raf;
const rand=(a,b)=>Math.random()*(b-a)+a;
function resize(){
  D=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*D); canvas.height=Math.round(H*D);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(D,0,0,D,0,0);
  if(img.complete&&img.naturalWidth) makePoints();
}
function makePoints(){
  const off=document.createElement('canvas'),oc=off.getContext('2d',{willReadFrequently:true});
  // Render poster into the same contain layout used on screen.
  const scale=Math.min(W/img.naturalWidth,H/img.naturalHeight);
  const dw=img.naturalWidth*scale,dh=img.naturalHeight*scale;
  const ox=(W-dw)/2,oy=(H-dh)/2;
  off.width=Math.max(1,Math.floor(dw));off.height=Math.max(1,Math.floor(dh));
  oc.drawImage(img,0,0,off.width,off.height);
  const data=oc.getImageData(0,0,off.width,off.height).data;
  points=[];
  // Dense sample points preserve the silhouette, bouquet and lettering.
  const step=Math.max(2,Math.round(Math.min(W,H)/300));
  for(let y=0;y<off.height;y+=step){for(let x=0;x<off.width;x+=step){
    const i=(y*off.width+x)*4,r=data[i],g=data[i+1],b=data[i+2];
    const lum=(r+g+b)/3;
    // Prefer bright red/pink details and highlights over the black background.
    if(lum>22 && (r>g*1.13 || lum>105)){
      points.push({tx:ox+x,ty:oy+y,r:rand(1.15,2.7),c:`rgb(${r},${g},${b})`,phase:rand(0,Math.PI*2),speed:rand(.025,.065),x:rand(0,W),y:rand(0,H),delay:rand(0,1)});
    }
  }}
  ambient=Array.from({length:Math.min(240,Math.floor(W*H/6500))},()=>({x:rand(0,W),y:rand(0,H),r:rand(.8,3.4),vy:rand(.15,.8),vx:rand(-.25,.25),a:rand(.2,.85),p:rand(0,7)}));
  start=performance.now();
}
function dot(x,y,r,color,a,blur){ctx.globalAlpha=a;ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=blur;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function animate(now){
  raf=requestAnimationFrame(animate);
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.fillStyle='#030106';ctx.fillRect(0,0,W,H);
  const bg=ctx.createRadialGradient(W*.42,H*.48,0,W*.42,H*.48,Math.max(W,H)*.72);
  bg.addColorStop(0,'rgba(115,0,27,.22)');bg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(const p of ambient){p.x+=p.vx+Math.sin(now*.0005+p.p)*.2;p.y-=p.vy;if(p.y<-8){p.y=H+8;p.x=rand(0,W)}if(p.x<0)p.x=W;if(p.x>W)p.x=0;dot(p.x,p.y,p.r,Math.random()>.25?'#ff234d':'#ff9aac',p.a*(.65+.35*Math.sin(now*.002+p.p)),8)}
  if(points.length){
    const elapsed=(now-start)/1000;
    const reveal=Math.min(1,elapsed/3.3);const ease=1-Math.pow(1-reveal,3);
    for(const p of points){
      p.x+=(p.tx-p.x)*Math.max(.012,p.speed*ease*1.8);p.y+=(p.ty-p.y)*Math.max(.012,p.speed*ease*1.8);
      const shimmer=.78+.22*Math.sin(now*.003+p.phase);
      const drift=reveal>.98?1:0;
      const x=p.x+Math.sin(now*.0014+p.phase)*1.05*drift;
      const y=p.y+Math.cos(now*.0017+p.phase)*1.05*drift;
      dot(x,y,p.r*2.1,p.c,.12*shimmer,14);dot(x,y,p.r,p.c,.92*shimmer,7);dot(x-.35,y-.35,p.r*.27,'#fff4f6',.78*shimmer,2);
    }
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}
img.onload=()=>{document.querySelector('#error').style.display='none';resize();};
img.onerror=()=>{document.querySelector('#error').style.display='grid'};
window.addEventListener('resize',resize);
requestAnimationFrame(animate);
</script>
</body>
</html>
