
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>20/10 - Ngàn Chấm Đỏ Yêu Thương</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;background:#050107;
}
body{font-family:Arial,sans-serif}
canvas{
  display:block;width:100%;height:100%;
}
.message{
  position:fixed;
  z-index:2;
  left:0;right:0;bottom:5%;
  text-align:center;
  pointer-events:none;
  padding:15px;
  animation:appear 2s ease 1s both;
}
.message h1{
  font-size:clamp(25px,5vw,48px);
  color:#ff526f;
  letter-spacing:3px;
  text-shadow:0 0 12px #ff1744,0 0 35px #ff1744;
}
.message p{
  font-size:clamp(13px,2.5vw,19px);
  color:#ffe0e7;
  text-shadow:0 0 10px #ff1744;
}
@keyframes appear{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}

/* Luôn hiển thị nội dung theo khung ngang trên điện thoại */
@media screen and (max-width: 768px) and (orientation: portrait) {
  canvas {
    width: 100vh;
    height: 100vw;
    position: fixed;
    top: 0;
    left: 100vw;
    transform-origin: top left;
    transform: rotate(90deg);
  }

  .message {
    width: 100vh;
    left: 100vw;
    bottom: auto;
    top: 100vw;
    transform: rotate(90deg);
    transform-origin: top left;
    padding: 8px;
  }

  .message h1 {
    font-size: 28px;
  }

  .message p {
    font-size: 14px;
  }
}

</style>
</head>

<body>
<canvas id="canvas"></canvas>

<div class="message">
  <h1>CHÚC MỪNG 20/10</h1>
  <p>Chúc một nửa thế giới luôn xinh đẹp và hạnh phúc ❤️</p>
</div>

<script>
async function lockLandscape() {
  try {
    await document.documentElement.requestFullscreen();
    await screen.orientation.lock("landscape");
  } catch (error) {
    console.log("Trình duyệt không hỗ trợ khóa hướng ngang.");
  }
}
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{alpha:false});

const img=new Image();
img.src="poster.png";

let W,H,D;
let particles=[];
let petals=[];
let started=false;
let startTime=0;
let lastTime=0;
let frame=0;

// Giới hạn số hạt để chạy mượt hơn
const MAX_PARTICLES=90000;
const MAX_PETALS=1000;

const rand=(a,b)=>Math.random()*(b-a)+a;

// Tạo sẵn ảnh chấm sáng, không dùng shadowBlur từng hạt
function createGlow(color){
  const c=document.createElement("canvas");
  c.width=c.height=64;
  const g=c.getContext("2d");

  const grad=g.createRadialGradient(32,32,0,32,32,32);
  grad.addColorStop(0,"rgba(255,255,255,1)");
  grad.addColorStop(.12,color);
  grad.addColorStop(.35,color);
  grad.addColorStop(1,"rgba(255,0,40,0)");

  g.fillStyle=grad;
  g.fillRect(0,0,64,64);
  return c;
}

const glowRed=createGlow("#ff1744");
const glowPink=createGlow("#ff6484");
const glowWhite=createGlow("#fff0f4");

function resize(){
  D=Math.min(window.devicePixelRatio||1,1.5);
  W=innerWidth;
  H=innerHeight;

  canvas.width=Math.round(W*D);
  canvas.height=Math.round(H*D);
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(D,0,0,D,0,0);

  if(img.complete&&img.naturalWidth)build();
}

function build(){
  const off=document.createElement("canvas");
  const oc=off.getContext("2d",{willReadFrequently:true});

  // Thu nhỏ ảnh dùng để lấy tọa độ hạt
  const sampleScale=Math.min(600/img.width,600/img.height);
  off.width=Math.round(img.width*sampleScale);
  off.height=Math.round(img.height*sampleScale);

  oc.drawImage(img,0,0,off.width,off.height);
  const pixels=oc.getImageData(
    0,0,off.width,off.height
  ).data;

  // Ảnh gốc chiếm toàn màn hình, không làm biến dạng
  const cover=Math.max(W/img.width,H/img.height);
  const imageW=img.width*cover;
  const imageH=img.height*cover;
  const ox=(W-imageW)/2;
  const oy=(H-imageH)/2;

  const step=Math.max(
    2,
    Math.ceil(Math.sqrt(off.width*off.height/MAX_PARTICLES))
  );

  const points=[];

  for(let y=0;y<off.height;y+=step){
    for(let x=0;x<off.width;x+=step){
      const i=(y*off.width+x)*4;
      const r=pixels[i];
      const g=pixels[i+1];
      const b=pixels[i+2];

      // Chọn những vùng đỏ, hồng và sáng
      if(r>100&&r>g*1.2&&r>b*1.05){
        points.push({
          x:ox+(x/off.width)*imageW,
          y:oy+(y/off.height)*imageH
        });
      }
    }
  }

  // Trộn ngẫu nhiên để hạt tụ hình từ nhiều hướng
  for(let i=points.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [points[i],points[j]]=[points[j],points[i]];
  }

  const selected=points.slice(0,MAX_PARTICLES);

  particles=selected.map((p,i)=>({
    x:rand(0,W),
    y:rand(0,H),
    tx:p.x,
    ty:p.y,
    size:rand(2.5,4.5),
    phase:rand(0,Math.PI*2),
    speed:rand(.035,.075),
    color:Math.random()<.15?glowPink:
          Math.random()<.08?glowWhite:glowRed
  }));

  petals=Array.from({length:MAX_PETALS},()=>({
    x:rand(0,W),
    y:rand(0,H),
    size:rand(5,12),
    vx:rand(-.35,.35),
    vy:rand(.3,.9),
    angle:rand(0,Math.PI*2),
    spin:rand(-.015,.015),
    phase:rand(0,8)
  }));

  startTime=performance.now();
  started=true;
}

// Vẽ chấm sáng bằng ảnh đã tạo sẵn
function dot(x,y,size,sprite,alpha=1){
  const s=size*3.2;
  ctx.globalAlpha=alpha;
  ctx.drawImage(sprite,x-s/2,y-s/2,s,s);
}

function drawPetal(p,dt){
  p.x+=p.vx*dt+Math.sin(frame*.015+p.phase)*.3*dt;
  p.y+=p.vy*dt;
  p.angle+=p.spin*dt;

  if(p.y>H+20){
    p.y=-20;
    p.x=rand(0,W);
  }

  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.angle);
  ctx.globalAlpha=.75;
  ctx.fillStyle="#ff315b";

  ctx.beginPath();
  ctx.moveTo(0,-p.size);
  ctx.bezierCurveTo(
    p.size,-p.size*.3,
    p.size*.7,p.size*.8,
    0,p.size
  );
  ctx.bezierCurveTo(
    -p.size*.7,p.size*.4,
    -p.size,-p.size*.4,
    0,-p.size
  );
  ctx.fill();
  ctx.restore();
}

function animate(now){
  requestAnimationFrame(animate);

  const dt=lastTime?
    Math.min((now-lastTime)/16.67,2):1;
  lastTime=now;
  frame+=dt;

  ctx.setTransform(D,0,0,D,0,0);
  ctx.globalAlpha=1;
  ctx.fillStyle="#050107";
  ctx.fillRect(0,0,W,H);

  if(!started||!img.naturalWidth)return;

  const elapsed=(now-startTime)/1000;

  // Giữ nguyên ảnh mẫu phía dưới để hình vẫn đẹp và sắc nét
  const cover=Math.max(W/img.width,H/img.height);
  const iw=img.width*cover;
  const ih=img.height*cover;

  // Zoom nhẹ nhàng
  const zoom=1+Math.min(elapsed*.00025,.025);
  const dw=iw*zoom;
  const dh=ih*zoom;

  ctx.globalAlpha=Math.min(1,elapsed);
  ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
  ctx.globalAlpha=1;

  // Hạt chuyển động nhẹ quanh vị trí đích
  for(const p of particles){
    p.x+=(p.tx-p.x)*p.speed*dt;
    p.y+=(p.ty-p.y)*p.speed*dt;

    const wave=Math.sin(now*.0025+p.phase);
    const x=p.x+wave*1.3;
    const y=p.y+Math.cos(now*.002+p.phase)*1.3;
    const alpha=.45+.45*(.5+.5*wave);

    dot(x,y,p.size,p.color,alpha);
  }

  // Cánh hoa bay chậm
  for(const p of petals){
    drawPetal(p,dt);
  }

  // Trái tim hạt sáng
  for(let i=0;i<38;i++){
    const t=i/38*Math.PI*2;
    const hx=16*Math.pow(Math.sin(t),3);
    const hy=-(13*Math.cos(t)-5*Math.cos(2*t)
      -2*Math.cos(3*t)-Math.cos(4*t));

    const x=W*.14+hx*1.3;
    const y=H*.25+hy*1.3;
    const pulse=1+.15*Math.sin(now*.004+i);

    dot(x,y,3*pulse,glowPink,.8);
  }

  ctx.globalAlpha=1;
}

img.onload=()=>{
  resize();
};

img.onerror=()=>{
  document.body.innerHTML=
    '<p style="color:white;padding:30px">Không tìm thấy poster.png. Hãy đặt ảnh cùng thư mục với index.html.</p>';
};

window.addEventListener("resize",resize);
requestAnimationFrame(animate);
</script>
</body>
</html>
